name: CI

# Solo pushes/PRs a main: en los tags la batería completa la ejecuta el
# workflow Release (lanzarla dos veces en paralelo con TCG dobla la carga
# del runner y hace fallar pasos sensibles al tiempo, como «sincronizar»).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  construir-probar:
    name: Compilar, probar y auditar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias (nasm, qemu, ovmf)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm qemu-system-x86 ovmf python3-pil

      - name: Zig 0.14.1 (versión fijada)
        run: |
          mkdir -p "$RUNNER_TEMP/zigtool"
          curl -sL https://ziglang.org/download/0.14.1/zig-x86_64-linux-0.14.1.tar.xz | tar -xJ -C "$RUNNER_TEMP/zigtool"
          echo "$RUNNER_TEMP/zigtool/zig-x86_64-linux-0.14.1" >> "$GITHUB_PATH"

      - name: Formato (zig fmt --check)
        run: zig fmt --check .

      - name: Compilar (kernel + bootloader + imagen)
        run: zig build -Drelease=true

      - name: Pruebas unitarias en host
        run: zig build test

      - name: Reproducibilidad de los pesos de la IA (entrenar-verificar)
        run: zig build entrenar-verificar

      - name: Prueba de arranque BIOS en QEMU (serial + capturas)
        env:
          TC: /noexiste
          OVMF_CODE: /usr/share/OVMF/OVMF_CODE_4M.fd
          OVMF_VARS: /usr/share/OVMF/OVMF_VARS_4M.fd
        run: python3 tools/probar_boot.py zig-out/antlexos.img build/pruebas --tiempo 60

      - name: Prueba de arranque UEFI en QEMU+OVMF
        env:
          TC: /noexiste
          OVMF_CODE: /usr/share/OVMF/OVMF_CODE_4M.fd
          OVMF_VARS: /usr/share/OVMF/OVMF_VARS_4M.fd
        run: python3 tools/probar_boot.py zig-out/antlexos.img build/pruebas_uefi --uefi --tiempo 150

      - name: Prueba de persistencia ALFS (escribir → reinicio → verificar)
        env:
          TC: /noexiste
          OVMF_CODE: /usr/share/OVMF/OVMF_CODE_4M.fd
          OVMF_VARS: /usr/share/OVMF/OVMF_VARS_4M.fd
        run: python3 tools/probar_alfs.py zig-out/antlexos.img build/pruebas_alfs --tiempo 120

      - name: Prueba de la IA AntLex (conversación real por QMP)
        env:
          TC: /noexiste
        run: python3 tools/probar_antlex.py zig-out/antlexos.img build/pruebas_antlex --tiempo 240

      - name: Ejecutables .ALX de punta a punta (Fase 7)
        env:
          TC: /noexiste
        run: python3 tools/probar_alx.py zig-out/antlexos.img build/pruebas_alx --tiempo 120

      - name: Arnés del escritorio (Fase 8, 60+ pasos QMP+HMP)
        env:
          TC: /noexiste
        run: python3 tools/probar_escritorio.py zig-out/antlexos.img build/pruebas_escritorio --tiempo 300

      - name: Red virtio-net (Fase 9a — ARP, ping y ACPI con slirp)
        env:
          TC: /noexiste
        run: python3 tools/probar_red.py zig-out/antlexos.img build/pruebas_red --tiempo 240

      - name: ISO en BIOS (El Torito, Fase 6)
        env:
          TC: /noexiste
        run: python3 tools/probar_iso.py zig-out/antlexos.iso build/iso_bios --tiempo 120

      - name: ISO en UEFI (OVMF + sección El Torito 0xEF, Fase 6)
        env:
          TC: /noexiste
          OVMF_CODE: /usr/share/OVMF/OVMF_CODE_4M.fd
          OVMF_VARS: /usr/share/OVMF/OVMF_VARS_4M.fd
        run: python3 tools/probar_iso.py zig-out/antlexos.iso build/iso_uefi --tiempo 240 --uefi

      - name: Auditoría de seguridad y calidad
        run: python3 tools/auditar.py

      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: antlexos-${{ github.sha }}
          path: |
            zig-out/antlexos.img
            zig-out/antlexos.iso
            zig-out/BOOTX64.EFI
            build/pruebas/*.png
            build/pruebas/serial.log
            build/pruebas_uefi/*.png
            build/pruebas_uefi/serial.log
            build/pruebas_alfs/serial_alfs.log
            build/pruebas_antlex/serial_antlex.log
            build/pruebas_escritorio/escritorio.png
            build/pruebas_escritorio/serial_final.log
            build/pruebas_red/serial_final.log
            build/iso_bios/escritorio-bios-cd.png
            build/iso_uefi/escritorio-uefi-cd.png
          if-no-files-found: error
